<html><body style="font-family: -apple-system, Helvetica; font-size: 13px;">
<h2>Juxta is installed</h2>
<p>It's in your Applications folder and should already be open.</p>
<ul>
<li>Drag two files or folders onto the window to compare them.</li>
<li>Press <b>⌥⌘↓</b> / <b>⌥⌘↑</b> to jump to the next or previous difference.</li>
<li>Press <b>⌘T</b> for a new tab and <b>⌘,</b> for Settings.</li>
</ul>
